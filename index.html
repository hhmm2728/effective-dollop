<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 창업 지원 투트랙 전략 로드맵</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
        google.charts.load('current', {'packages':['timeline']});
        google.charts.setOnLoadCallback(drawChart);

        function drawChart() {
            var container = document.getElementById('timeline-chart');
            var chart = new google.visualization.Timeline(container);
            var dataTable = new google.visualization.DataTable();

            dataTable.addColumn({ type: 'string', id: 'Category' });
            dataTable.addColumn({ type: 'string', id: 'Name' });
            dataTable.addColumn({ type: 'date', id: 'Start' });
            dataTable.addColumn({ type: 'date', id: 'End' });

            // 자바스크립트에서 월(Month)은 0부터 시작함 (예: 2 = 3월, 4 = 5월)
            dataTable.addRows([
                [ '예비창업패키지', '서류 접수 (3/6~3/24)', new Date(2026, 2, 6), new Date(2026, 2, 24) ],
                [ '예비창업패키지', '사전 인큐베이팅 및 평가', new Date(2026, 3, 1), new Date(2026, 4, 30) ],
                [ '예비창업패키지', '최종 선정 및 확약서 제출', new Date(2026, 4, 25), new Date(2026, 5, 5) ],
                
                [ '모두의 창업', '세부 공고 및 투트랙 추가 지원', new Date(2026, 2, 25), new Date(2026, 3, 15) ],
                [ '모두의 창업', '서류 및 오디션 경연', new Date(2026, 4, 1), new Date(2026, 5, 30) ],
                
                [ '웹 서비스 개발', '사용자 고민 분석 UI/UX 기획', new Date(2026, 2, 10), new Date(2026, 3, 30) ],
                [ '웹 서비스 개발', '1단계 개발 (핵심 명언 매칭 기능)', new Date(2026, 5, 5), new Date(2026, 8, 30) ],
                [ '웹 서비스 개발', '2단계 고도화 및 시장 반응 검증', new Date(2026, 9, 1), new Date(2027, 0, 31) ],
                
                [ '마일스톤', '대표자 명의 사업자 등록 의무', new Date(2026, 10, 1), new Date(2026, 10, 30) ],
                [ '마일스톤', '1단계 최종 보고 및 정산', new Date(2027, 0, 15), new Date(2027, 0, 31) ]
            ]);

            var options = {
                timeline: { showRowLabels: true, colorByRowLabel: true },
                hAxis: { format: '2026.MM' },
                backgroundColor: '#f8f9fa'
            };

            chart.draw(dataTable, options);
        }
    </script>
    <style>
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            padding: 40px 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 28px;
            color: #2c3e50;
        }
        .header p {
            color: #7f8c8d;
            font-size: 16px;
        }
        #timeline-chart {
            width: 100%;
            height: 600px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background-color: #fff;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 2026 투트랙 창업 지원 및 서비스 런칭 마일스톤</h1>
        <p>예비창업패키지 & 모두의 창업 프로젝트 동시 진행 로드맵</p>
    </div>
    <div id="timeline-chart"></div>
</body>
</html>
